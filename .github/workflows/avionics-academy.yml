name: Avionics EE Practice Academy regression
on:
  push:
    branches:
      - main
      - feature/avionics-ee-practice-academy
      - feature/avionics-baby-steps-workbook-v2
      - feature/avionics-question-specific-visuals-v3
      - fix/avionics-browser-feedback-guided-circuits-v4
      - fix/si-and-curriculum-accuracy-audit-v5
      - fix/mathml-layout-and-textbook-map-v6
      - feature/coursework-circuit-notebook-labs-v7
      - feature/nucleo-fullboard-progressive-video-v9
      - fix/distinct-690-learning-objectives-v10
      - feature/integrated-circuit-mastery-v11
      - fix/question-specific-wiring-circuitjs-v8
  pull_request:
    paths:
      - 'index.html'
      - 'app.js'
      - 'avionics_*.js'
      - 'tests/avionics-array-math-v40.test.cjs'
      - 'avionics_*.css'
      - 'tests/avionics-academy.test.cjs'
      - 'tests/avionics-assessor.test.cjs'
      - 'tests/avionics-curriculum-accuracy.test.cjs'
      - 'tests/avionics-notebook.test.cjs'
      - 'tests/avionics-live-wiring.test.cjs'
      - 'tests/avionics-progressive-nucleo-videos.test.cjs'
      - 'tests/avionics-curriculum-distinct-v10.test.cjs'
      - 'tests/avionics-integrated-v11.test.cjs'
      - 'tests/avionics-dice-methods-v12.test.cjs'
      - 'tests/avionics-advanced-50-v12.test.cjs'
      - 'tests/nvidia-slt-academy-v1.test.cjs'
      - 'tests/nvidia-slt-visual-lab-v2.test.cjs'
      - 'nvidia_slt_*.js'
      - 'tests/nvidia-dual-math-v41.test.cjs'
      - 'tests/nvidia-real-math-v42.test.cjs'
      - 'nvidia_slt.css'
      - 'ohmf1_engineer_studio_v2.js'
      - 'circuit_question_railroad_v2.js'
      - 'circuit_question_railroad_v2.css'
      - 'tests/circuit-question-railroad-v2.test.cjs'
      - 'tests/four-tab-svg-math-v39.test.cjs'
      - 'professor_notebook_spreads.js'
      - 'circuit_railroad_whiteboard_v1.js'
      - 'circuit_railroad_whiteboard_v1.css'
      - 'tests/circuit-railroad-whiteboard-v1.test.cjs'
      - 'ohmf1_engineer_studio_v2.css'
      - 'tests/ohmf1-engineer-studio-v2.test.cjs'
      - 'engineering_solved_cases_v1.js'
      - 'engineering_solved_cases_v1.css'
      - 'tests/engineering-solved-cases-v1.test.cjs'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Parse JavaScript and audit original problem bank
        run: |
          node --check app.js
          node --check avionics_data.js
          node --check avionics_questions.js
          node --check avionics_distinct_labs_v10.js
          node --check avionics_distinct_math_v10.js
          node --check avionics_dice_methods_v12.js
          node --check avionics_distinct_reasoning_v10.js
          node --check avionics_integrative_capstones_v11.js
          node --check avionics_mixed_networks_v11.js
          node --check avionics_advanced_50_v12.js
          node --check avionics_array_math_v40.js
          node --check nvidia_slt_tracks.js
          node --check nvidia_slt_math.js
          node --check nvidia_slt_questions.js
          node --check nvidia_slt_ui.js
          node --check nvidia_slt_equations_v41.js
          node --check nvidia_slt_math_proofs_v42.js
          node --check engineering_solved_cases_v1.js
          node --check nvidia_slt_visual_lab_v2.js
          node --check ohmf1_engineer_studio_v2.js
          node --check circuit_railroad_whiteboard_v1.js
          node --check circuit_question_railroad_v2.js
          node --check avionics_mixed_visuals_v11.js
          node --check avionics_practice.js
          node --check avionics_beginner_lessons.js
          node --check avionics_tutor.js
          node --check avionics_visuals.js
          node --check avionics_nucleo_workbench.js
          node --check avionics_video_lessons.js
          node --check avionics_circuit_simulator.js
          node --check avionics_assessor.js
          node --check avionics_si_lesson.js
          node --check avionics_textbook_toc.js
          node --check avionics_notebook_cases.js
          node --check avionics_notebook_labs.js
          node tests/avionics-academy.test.cjs
          node tests/avionics-assessor.test.cjs
          node tests/avionics-curriculum-accuracy.test.cjs
          node tests/avionics-notebook.test.cjs
          node tests/avionics-live-wiring.test.cjs
          node tests/avionics-progressive-nucleo-videos.test.cjs
          node tests/avionics-curriculum-distinct-v10.test.cjs
          node tests/avionics-integrated-v11.test.cjs
          node tests/avionics-dice-methods-v12.test.cjs
          node tests/avionics-advanced-50-v12.test.cjs
          node tests/nvidia-slt-academy-v1.test.cjs
          node tests/nvidia-slt-visual-lab-v2.test.cjs
          node tests/engineering-solved-cases-v1.test.cjs
          node tests/ohmf1-engineer-studio-v2.test.cjs
          node tests/circuit-railroad-whiteboard-v1.test.cjs
          node tests/circuit-question-railroad-v2.test.cjs
          node tests/four-tab-svg-math-v39.test.cjs
          node tests/nvidia-dual-math-v41.test.cjs
          node tests/nvidia-real-math-v42.test.cjs
          node tests/avionics-array-math-v40.test.cjs
      - name: Install headless browser for desktop and mobile smoke tests
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Start static site and check questions, equations, grading and storage
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/avionics-site.log 2>&1 &
          sleep 2
          RUN_BROWSER=1 node tests/avionics-academy.test.cjs
          RUN_BROWSER=1 node tests/nvidia-slt-academy-v1.test.cjs
          RUN_BROWSER=1 node tests/ohmf1-engineer-studio-v2.test.cjs
          RUN_BROWSER=1 node tests/circuit-railroad-whiteboard-v1.test.cjs
          RUN_BROWSER=1 node tests/circuit-question-railroad-v2.test.cjs
          RUN_BROWSER=1 node tests/four-tab-svg-math-v39.test.cjs
          RUN_BROWSER=1 node tests/nvidia-dual-math-v41.test.cjs
          RUN_BROWSER=1 node tests/nvidia-real-math-v42.test.cjs
          RUN_BROWSER=1 node tests/avionics-array-math-v40.test.cjs
          node tests/avionics-hw-debug-interview.test.cjs
